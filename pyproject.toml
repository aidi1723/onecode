[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onecode"
version = "0.8.0"
description = "Local-first agent kernel with guarded model plan execution"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = []

[project.optional-dependencies]
tui = [
    "textual==8.2.7",
]
dev = [
    "ruff>=0.8",
    "coverage>=7",
    "mypy>=1.13",
]

[project.scripts]
onecode = "onecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"onecode.tui" = ["styles.tcss"]
"onecode.web" = ["*.html"]
"onecode.contracts" = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.coverage.run]
source = ["onecode"]
branch = false

[tool.coverage.report]
fail_under = 75
show_missing = false
skip_empty = true
