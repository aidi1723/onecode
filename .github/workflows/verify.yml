name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  onecode:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify OneCode
        run: bash scripts/verify.sh
      - name: Run Industrial Agent Redline Harness
        run: python scripts/bench_industrial.py --run-redlines
      - name: Generate CycloneDX and SPDX SBOM
        run: |
          python scripts/generate_sbom.py --format cyclonedx --output /tmp/onecode.cyclonedx.json
          python scripts/generate_sbom.py --format spdx --output /tmp/onecode.spdx.json
      - name: Upload SBOM artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: onecode-sbom
          path: |
            /tmp/onecode.cyclonedx.json
            /tmp/onecode.spdx.json
      - name: Build wheel and verify packaged TUI assets
        run: |
          python -m pip wheel . -w /tmp/onecode-wheelhouse --no-deps
          python scripts/check_wheel_assets.py /tmp/onecode-wheelhouse
